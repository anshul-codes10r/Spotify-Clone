<!-- Search page -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
   <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="search.css">
    <script src="../js/script.js" defer></script>
</head>

<body>
    <header class="search-head">
        <img src="assets/images/profile.jpg" alt="Profile picture">
        <h1>Search</h1>
        <img class="svg" src="assets/logo.svg/camera.svg" alt="" />
    </header>
    <search class="search-container">
        <form>
            <img src="assets/logo.svg/search.svg" alt="" />
            <input type="search" placeholder="What do you want to listen to?" aria-label="Search music">
        </form>
    </search>
   <main>
       <section class="boxes">
            <a href="playlist-vibes.html" class="box">
               <img src="assets/images/vibes.jpg" alt="">
                <span class="playlist-name">Love</span>
            </a>
            <a href="playlist-hindi.html" class="box">
               <img src="assets/images/hindi.jpg" alt="">
               <span class="playlist-name">Hindi Hits</span>
            </a>
            <a href="playlist-english.html" class="box">
               <img src="assets/images/english.jpg" alt="">
               <span class="playlist-name">Music</span>
            </a> 
            <a href="playlist-late.html" class="box">
                <img src="assets/images/late.jpg" alt="">
                <span class="playlist-name">Sleep</span>
            </a>
            <a href="playlist-hype.html" class="box">
               <img src="assets/images/hype.jpg" alt="">
               <span class="playlist-name">Workout</span>
            </a>
       </section>
       <div class="ad">
           <h2>Advertisement</h2>
            <iframe src="https://www.youtube.com/embed/0d9T8d74V-Q?autoplay=1&controls=0"
                allow="autoplay; encrypted-media" 
                allowfullscreen></iframe>
       </div>
       <section class="discover">
           <h2>Discover something new</h2>
           <div class="posters">
                <a href="#" class="poster">
                    <img src="assets/images16/love.jpeg" alt="">
                </a>
                <a href="#" class="poster">
                    <img src="assets/images16/party.jpeg" alt="">
                </a>
                <a href="#" class="poster">
                    <img src="assets/images16/cardio.jpeg" alt="">
                </a>
                <a href="#" class="poster">
                    <img src="assets/images16/english.jpeg" alt="">
                </a>
                <a href="#" class="poster">
                    <img src="assets/images16/hits.jpeg" alt="">
                </a>
                <a href="#" class="poster">
                    <img src="assets/images16/radio.jpeg" alt="">
                </a>
           </div>
       </section>
   </main>
    <nav class="bottom-nav" aria-label="Main navigation">
       <a href="index.html" class="home">
           <img class="o-icon" src="assets/logo.svg/home-o.svg" alt="" />
            <img class="f-icon" src="assets/logo.svg/home-f.svg" alt="" />
           <span>Home</span>
       </a>
       <a href="search.html" class="search active">
           <img class="o-icon" src="assets/logo.svg/search-o.svg" alt="" />
           <img class="f-icon" src="assets/logo.svg/search-f.svg" alt="" />
           <span>Search</span>
       </a>
       <a href="library.html" class="library">
           <img class="o-icon" src="assets/logo.svg/library-o.svg" alt="" />
           <img class="f-icon" src="assets/logo.svg/library-f.svg" alt="" />
           <span>Your Library</span>
       </a>
       <a href="premium.html" class="premium">
           <img class="o-icon" src="assets/logo.svg/spotify-o.svg" alt="" />
           <img class="f-icon" src="assets/logo.svg/spotify-f.svg" alt="" />
           <span>Premium</span>
       </a>
       <a href="create.html" class="create">
           <img class="o-icon" src="assets/logo.svg/plus-o.svg" alt="">
           <img class="f-icon" src="assets/logo.svg/plus-f.svg" alt="">
           <span>Create</span>
       </a>
   </nav>
    <div class="music-player">

        <div class="player-top">
            <div class="song-info">
                <img
                    class="song-image"
                    src="assets/images/poster1.jpg"
                    alt="Song cover"
                />

                <div class="song-details">
                    <p class="song-title">Ishq</p>
                    <span class="song-artist">Ig - jharajnish21</span>
                </div>
            </div>
            <div class="player-controls">

                <button class="previous-btn" type="button"
                    aria-label="Previous song">
                    <img src="assets/logo.svg/previous.svg" alt="" />
                </button>

                <button class="play-pause-btn" type="button"
                    aria-label="Play">
                    <img src="assets/logo.svg/play.svg" alt="" />
                </button>

                <button class="next-btn" type="button"
                    aria-label="Next song">
                    <img src="assets/logo.svg/next.svg" alt="" />
                </button>

            </div>
        </div>
        <div class="progress-container">
            <span class="current-time">0:00</span>

            <input
                class="progress-bar"
                type="range"
                min="0"
                max="100"
                value="0"
                aria-label="Song progress"
            />

            <span class="duration">0:00</span>
        </div>

    </div>

</body>

      </html>
